<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="78" viewBox="0 0 1000 78" role="img" aria-label="Causal Dynamic Pricing — Nightly price for every listing, 365 days out, re-optimised daily."><title>Causal Dynamic Pricing — Nightly price for every listing, 365 days out, re-optimised daily.</title><style>@font-face{font-family:JB;font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:JB;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:IN;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:IS;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:IS;font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2');}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{from{transform:translateX(-420px)}to{transform:translateX(1400px)}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
.spin-r{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite reverse}
.sweep{animation:sweep 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
