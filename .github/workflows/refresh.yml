name: refresh-profile

on:
  schedule:
    - cron: "17 6 * * *"        # daily, 06:17 UTC (off the top of the hour to avoid queue spikes)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile.json", "scripts/**", "assets/fonts/**"]

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "fonttools[woff]==4.55.3" "pillow==11.0.0"

      - name: Build cards from live GitHub data
        env:
          # GITHUB_TOKEN sees public contributions. Add a classic PAT with read:user as
          # GH_STATS_TOKEN if you want private-repo contributions counted too.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --live

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/cards data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi
